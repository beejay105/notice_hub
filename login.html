<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign in · Notice Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<section class="login-screen"><div class="login-art" aria-hidden="true"><div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div><div class="art-note note-one"><i data-lucide="message-circle"></i></div><div class="art-note note-two"><i data-lucide="paperclip"></i></div><div class="art-note note-three"><i data-lucide="image"></i></div></div><div class="login-card"><div class="brand-lockup login-brand"><div class="brand-mark"><i data-lucide="radio-tower"></i></div><div><strong>notice<span>hub</span></strong><small>your team, together</small></div></div><p class="eyebrow">Welcome back</p><h1>Make sure everyone<br><span>hears the news.</span></h1><p class="login-copy">Sign in to your organization's private communication space.</p><form id="login-form"><label class="field-label">Your name<input id="login-name" type="text" placeholder="e.g. Alex Lee" autocomplete="name" required></label><label class="field-label">Access code<input id="access-code" type="password" placeholder="Enter your access code" required></label><button class="send-button login-button" type="submit">Enter Notice Hub <i data-lucide="arrow-right"></i></button></form><p class="login-help"><i data-lucide="lock-keyhole"></i> Your access code keeps this space private.</p></div></section><div class="toast" id="toast" role="status"></div><script src="https://unpkg.com/lucide@latest"></script><script src="login.js"></script></body></html>
